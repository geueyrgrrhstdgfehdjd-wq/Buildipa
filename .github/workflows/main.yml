name: Build Unsigned iOS IPA

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Package IPA Structure correctly
        run: |
          # 1. ล้างไดเรกทอรี build เก่า
          rm -rf build
          
          # 2. สร้างโครงสร้างตามมาตรฐาน iOS: Payload/NabeeCode.app
          mkdir -p build/Payload/NabeeCode.app
          APP_DIR="build/Payload/NabeeCode.app"

          # 3. คัดลอกไฟล์ทั้งหมดจาก Repository เข้าไปไว้ในตัวแอป
          cp -R ./* "$APP_DIR/" 2>/dev/null || true
          
          # ลบโฟลเดอร์ขยะของ GitHub ออกจากตัวแอป
          rm -rf "$APP_DIR/build" "$APP_DIR/.git" "$APP_DIR/.github"

          # 4. ตรวจสอบให้มั่นใจว่าไฟล์ Info.plist อยู่นอกสุดของโฟลเดอร์ .app
          FIND_PLIST=$(find . -name "Info.plist" -not -path "./build/*" | head -n 1)
          if [ -n "$FIND_PLIST" ]; then
            cp "$FIND_PLIST" "$APP_DIR/Info.plist"
          fi

          # 5. สร้าง Executable Binary พื้นฐานเพื่อเปิดตัวแอป
          echo "import Foundation" > main.swift
          echo 'print("App Loaded")' >> main.swift
          swiftc -target arm64-apple-ios15.0 main.swift -o "$APP_DIR/NabeeCode" || true
          rm -f main.swift

          # 6. บีบอัดเฉพาะโฟลเดอร์ Payload เป็นไฟล์ nextra.ipa
          cd build
          zip -r -9 nextra.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cracknabee-ipa
          path: build/nextra.ipa
