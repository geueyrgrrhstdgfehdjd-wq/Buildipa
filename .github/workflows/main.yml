name: Build Unsigned iOS IPA

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Package IPA Structure correctly
        run: |
          # 1. เคลียร์โฟลเดอร์ build เก่าทั้งหมด
          rm -rf build
          
          # 2. สร้างโครงสร้างหลักตามมาตรฐาน iOS
          mkdir -p build/Payload/NabeeCode.app
          APP_DIR="build/Payload/NabeeCode.app"

          # 3. คัดลอกไฟล์ทั้งหมดจาก Repo เข้าไปในตัวแอป
          cp -R ./* "$APP_DIR/" 2>/dev/null || true

          # ลบโฟลเดอร์ขยะของ GitHub ออกจากตัวแอป
          rm -rf "$APP_DIR/build" "$APP_DIR/.git" "$APP_DIR/.github"

          # 4. ค้นหาไฟล์ Info.plist เดิมใน Repo แล้วก๊อปปี้มาไว้ที่ชั้นนอกสุดของ .app
          PLIST_PATH=$(find . -name "Info.plist" -not -path "./build/*" | head -n 1)
          if [ -n "$PLIST_PATH" ]; then
            cp "$PLIST_PATH" "$APP_DIR/Info.plist"
          fi

          # 5. สร้าง Executable Binary สำหรับตัวแอป
          echo 'int main() { return 0; }' > main.c
          clang -arch arm64 -isysroot $(xcrun --sdk iphoneos --show-sdk-path) main.c -o "$APP_DIR/NabeeCode" || true
          rm -f main.c

          # 6. บีบอัดโฟลเดอร์ Payload เป็นไฟล์ nextra.ipa
          cd build
          zip -q -r -9 nextra.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cracknabee-ipa
          path: build/nextra.ipa
