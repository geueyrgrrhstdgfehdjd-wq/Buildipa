name: Build Unsigned iOS IPA

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Dynamic Filename (Timestamp)
        run: |
          # สร้างข้อความเวลา เช่น 20260924_080512
          TIMESTAMP=$(date +'%Y%m%d_%H%M%S')
          echo "IPA_NAME=nextra_${TIMESTAMP}.ipa" >> $GITHUB_ENV
          echo "ARTIFACT_NAME=cracknabee-ipa-${TIMESTAMP}" >> $GITHUB_ENV

      - name: Build Unsigned IPA for Gbox
        run: |
          # 1. ล้างโฟลเดอร์ build เก่า
          rm -rf build
          
          # 2. สร้างโครงสร้าง Payload/NABEE HEX.app ให้ตรงตามโปรเจกต์
          mkdir -p "build/Payload/NABEE HEX.app"
          APP_DIR="build/Payload/NABEE HEX.app"

          # 3. คัดลอกไฟล์ทั้งหมดใน Repo เข้าไปในตัวแอป
          cp -R ./* "$APP_DIR/" 2>/dev/null || true
          
          # 4. ลบโฟลเดอร์ขยะ
          rm -rf "$APP_DIR/build" "$APP_DIR/.git" "$APP_DIR/.github"

          # 5. คอมไพล์ Binary ปลอมชื่อ NABEE HEX
          echo 'int main() { return 0; }' > main.c
          clang -arch arm64 -isysroot $(xcrun --sdk iphoneos --show-sdk-path) main.c -o "$APP_DIR/NABEE HEX" || true
          rm -f main.c

          # 6. บีบอัดเป็นไฟล์ .ipa ด้วยชื่อไดนามิก
          cd build
          zip -q -r -9 "${{ env.IPA_NAME }}" Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: build/${{ env.IPA_NAME }}
