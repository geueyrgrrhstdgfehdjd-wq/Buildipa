name: Build Unsigned iOS IPA for External Signing

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest-stable'

      - name: Clean and Archive Project (No Code Sign)
        run: |
          mkdir -p build

          # ค้นหาไฟล์ .xcodeproj หรือ .xcworkspace โดยอัตโนมัติ
          PROJ_FILE=$(find . -maxdepth 2 -name "*.xcworkspace" -o -name "*.xcodeproj" | head -n 1)

          if [ -z "$PROJ_FILE" ]; then
            echo "Error: ไม่พบไฟล์ .xcodeproj หรือ .xcworkspace ใน Repository"
            exit 1
          fi

          echo "Found project file: $PROJ_FILE"

          # ตรวจสอบว่าเป็น workspace หรือ project
          if [[ "$PROJ_FILE" == *.xcworkspace ]]; then
            # ดึงชื่อ Scheme แรกที่พบ
            SCHEME=$(xcodebuild -workspace "$PROJ_FILE" -list | grep -A 10 "Schemes:" | tail -n +2 | head -n 1 | xargs)
            
            xcodebuild archive \
              -workspace "$PROJ_FILE" \
              -scheme "$SCHEME" \
              -configuration Release \
              -archivePath build/App.xcarchive \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY="" \
              clean archive
          else
            SCHEME=$(xcodebuild -project "$PROJ_FILE" -list | grep -A 10 "Schemes:" | tail -n +2 | head -n 1 | xargs)
            
            xcodebuild archive \
              -project "$PROJ_FILE" \
              -scheme "$SCHEME" \
              -configuration Release \
              -archivePath build/App.xcarchive \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY="" \
              clean archive
          fi

      - name: Package Payload into .ipa
        run: |
          mkdir -p build/IPA/Payload
          
          # คัดลอกโฟลเดอร์ .app จาก archive ออกมา
          cp -r build/App.xcarchive/Products/Applications/*.app build/IPA/Payload/
          
          # บีบอัดโฟลเดอร์ Payload เป็น .ipa
          cd build/IPA
          zip -r Unsigned_App.ipa Payload
          
          echo "สร้างไฟล์ Unsigned_App.ipa สำเร็จ"

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Unsigned-IPA-for-Gbox
          path: build/IPA/Unsigned_App.ipa
