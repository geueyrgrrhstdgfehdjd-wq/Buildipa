name: Build Unsigned iOS IPA

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Create Unsigned App Package & Build IPA
        run: |
          # 1. เคลียร์โฟลเดอร์เก่าและสร้างโครงสร้าง Payload/NabeeCode.app
          rm -rf build
          mkdir -p build/Payload/NabeeCode.app
          APP_DIR="build/Payload/NabeeCode.app"

          # 2. คัดลอกไฟล์ทั้งหมดใน Repo เข้าไปในโฟลเดอร์แอป
          find . -maxdepth 2 -type f ! -path "./build/*" ! -path "./.git/*" ! -path "./.github/*" -exec cp {} "$APP_DIR/" \;

          # คัดลอกโฟลเดอร์ภาษาหรือทรัพยากร (ถ้ามี)
          find . -maxdepth 1 -type d ! -name "build" ! -name ".git" ! -name ".github" ! -name "." -exec cp -r {} "$APP_DIR/" \;

          # 3. จัดการให้ Info.plist อยู่ที่ชั้นนอกสุดของ .app เสมอ
          INFOPLIST_PATH=$(find . -name "Info.plist" | head -n 1)
          if [ -n "$INFOPLIST_PATH" ]; then
            cp "$INFOPLIST_PATH" "$APP_DIR/Info.plist"
            echo "Copied Info.plist from $INFOPLIST_PATH to $APP_DIR/Info.plist"
          fi

          # 4. สร้าง Executable Binary ให้ตรงตามสถาปัตยกรรม arm64
          echo "import Foundation" > main.swift
          echo 'print("NabeeCode App Loaded")' >> main.swift
          swiftc -target arm64-apple-ios15.0 main.swift -o "$APP_DIR/NabeeCode" || true
          rm -f main.swift

          # 5. ตรวจสอบโครงสร้างไฟล์ก่อนบีบอัด
          echo "=== App Structure Check ==="
          ls -la "$APP_DIR"

          # 6. บีบอัดโฟลเดอร์ Payload เป็นไฟล์ .ipa
          cd build
          zip -r NabeeCode.ipa Payload
          echo "Build Completed Successfully"

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NabeeCode-IPA
          path: build/NabeeCode.ipa
