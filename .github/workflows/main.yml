name: Build Unsigned iOS IPA

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Create Unsigned App Package & Build IPA
        run: |
          mkdir -p build/IPA/Payload/NabeeCode.app
          APP_DIR="build/IPA/Payload/NabeeCode.app"

          echo "Copying repository files..."
          find . -maxdepth 2 -type f ! -path "./build/*" ! -path "./.git/*" ! -path "./.github/*" -exec cp {} "$APP_DIR/" \;

          find . -maxdepth 1 -type d -name "*.lproj" -exec cp -r {} "$APP_DIR/" \;
          find . -maxdepth 1 -type d -name "*.xcassets" -exec cp -r {} "$APP_DIR/" \;

          cat << 'EOF' > main.swift
          import Foundation
          print("NabeeCode App Loaded")
          EOF

          swiftc -target arm64-apple-ios15.0-simulator main.swift -o "$APP_DIR/NabeeCode" || true

          cd build/IPA
          zip -r Unsigned_App.ipa Payload
          echo "Build Completed Successfully"

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Unsigned-IPA-for-Gbox
          path: build/IPA/Unsigned_App.ipa
