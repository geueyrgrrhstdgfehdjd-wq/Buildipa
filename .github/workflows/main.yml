name: Build Unsigned iOS IPA for External Signing

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch: # ปุ่มกดสั่งสั่ง Run บน GitHub

jobs:
  build-ios:
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest-stable'

      - name: Clean and Archive Project (No Code Sign)
        run: |
          mkdir -p build
          
          # ค้นหาไฟล์ .xcworkspace หรือ .xcodeproj
          if [ -d "*.xcworkspace" ]; then
            WORKSPACE=$(ls -d *.xcworkspace | head -n 1)
            SCHEME=$(xcodebuild -workspace "$WORKSPACE" -list | grep -A 10 "Schemes:" | tail -n +2 | head -n 1 | xargs)
            
            xcodebuild archive \
              -workspace "$WORKSPACE" \
              -scheme "$SCHEME" \
              -configuration Release \
              -archivePath build/App.xcarchive \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY="" \
              clean archive
          else
            PROJECT=$(ls -d *.xcodeproj | head -n 1)
            SCHEME=$(xcodebuild -project "$PROJECT" -list | grep -A 10 "Schemes:" | tail -n +2 | head -n 1 | xargs)
            
            xcodebuild archive \
              -project "$PROJECT" \
              -scheme "$SCHEME" \
              -configuration Release \
              -archivePath build/App.xcarchive \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY="" \
              clean archive
          fi

      - name: Package Payload into .ipa
        run: |
          mkdir -p build/IPA/Payload
          
          # คัดลอกโฟลเดอร์ .app จาก archive ออกมาใส่ในโฟลเดอร์ Payload
          cp -r build/App.xcarchive/Products/Applications/*.app build/IPA/Payload/
          
          # บีบอัดโฟลเดอร์ Payload ให้กลายเป็นไฟล์ .ipa
          cd build/IPA
          zip -r Unsigned_App.ipa Payload
          
          echo "สร้างไฟล์ Unsigned_App.ipa สำเร็จ"

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Unsigned-IPA-for-Gbox
          path: build/IPA/Unsigned_App.ipa
