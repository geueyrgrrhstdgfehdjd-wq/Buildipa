name: Build Unsigned iOS IPA for External Signing

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Create Unsigned App Package & Build IPA
        run: |
          # 1. สร้างไดเรกทอรีโครงสร้างแอป
          mkdir -p build/IPA/Payload/NabeeCode.app
          APP_DIR="build/IPA/Payload/NabeeCode.app"

          # 2. คัดลอกไฟล์ทั้งหมดที่มีใน Repository เข้าไปในโฟลเดอร์แอปโดยตรง
          echo "Copying files from repository..."
          find . -maxdepth 2 -type f ! -path "./build/*" ! -path "./.git/*" ! -path "./.github/*" -exec cp {} "$APP_DIR/" \;

          # คัดลอกโฟลเดอร์ภาษาและโฟลเดอร์ย่อยอื่นๆ (ถ้ามี)
          find . -maxdepth 1 -type d -name "*.lproj" -exec cp -r {} "$APP_DIR/" \;
          find . -maxdepth 1 -type d -name "*.xcassets" -exec cp -r {} "$APP_DIR/" \;

          # 3. สร้างไฟล์ Executable สำหรับโครงสร้าง iOS App
          cat <<EOF > main.swift
import Foundation
print("NabeeCode App Loaded")
EOF
          swiftc -target arm64-apple-ios15.0-simulator main.swift -o "$APP_DIR/NabeeCode" || true

          # 4. บีบอัดโฟลเดอร์ Payload ออกมาเป็นไฟล์ .ipa
          cd build/IPA
          zip -r Unsigned_App.ipa Payload

          echo "=== สร้างไฟล์ Unsigned_App.ipa เรียบร้อยแล้ว ==="

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Unsigned-IPA-for-Gbox
          path: build/IPA/Unsigned_App.ipa
